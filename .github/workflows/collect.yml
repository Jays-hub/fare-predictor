name: collect-fares

on:
  schedule:
    - cron: "0 10 * * *"    # 06:00 ET (EDT) — after overnight repricing
    - cron: "0 22 * * *"    # 18:00 ET (EDT) — after intraday movement
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

concurrency:
  group: collect-fares
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # Worst case (every combo exhausting retries on both passes) is ~25 min at
    # 15 combos; rows persist per-combo, so a timeout only truncates a cycle.
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/collect.py