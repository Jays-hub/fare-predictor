name: collect-fares

on:
  schedule:
    - cron: "0 10 * * *"    # 06:00 ET (EDT) — after overnight repricing
    - cron: "0 22 * * *"    # 18:00 ET (EDT) — after intraday movement
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

concurrency:
  group: collect-fares
  cancel-in-progress: false   # if a run somehow overlaps, queue it, don't run two at once

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20         # bound a stuck run so it can't burn minutes for hours
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # injected from repo secret, never in code
        run: python scripts/collect.py